function saveAttempt(a){ const arr=loadAttempts(); arr.push(a); try{ localStorage.setItem(LS_KEY, JSON.stringify(arr)); }catch(e){} }

let chapters=[...new Set(QUESTIONS.map(q=>q.chapter))];
let session=[], idx=0, score=0, wrong=0;

function renderChapterFilters(){
  const c=$("chapter-filters"); c.innerHTML="";
  chapters.forEach(ch=>{
    const n=QUESTIONS.filter(q=>q.chapter===ch).length;
    const lab=document.createElement("label"); lab.className="chapter-row";
    lab.innerHTML=`<input type="checkbox" checked value="${ch.replace(/"/g,'&quot;')}"><span>${ch} <span class="small">(${n})</span></span>`;
    c.appendChild(lab);
  });
}
function selectedChapters(){
  return [...document.querySelectorAll("#chapter-filters input:checked")].map(i=>i.value);
}
function weakChapters(){
  const att=loadAttempts(); if(!att.length) return [];
  const byCh={};
  att.forEach(a=>{ const q=QUESTIONS[a.qid]; if(!q) return;
    const b=byCh[q.chapter]||(byCh[q.chapter]={ok:0,n:0}); b.n++; if(a.correct) b.ok++; });
  return Object.entries(byCh)
    .map(([chapter,s])=>({chapter, accuracy:Math.round(s.ok/s.n*100)}))
    .filter(w=>w.accuracy<70).sort((a,b)=>a.accuracy-b.accuracy);
}
function renderWeak(elId){
  const el=$(elId), weak=weakChapters();
  el.innerHTML = weak.length
    ? weak.map(w=>`<div class="weak-row"><span>${w.chapter}</span><strong style="color:var(--red);">${w.accuracy}%</strong></div>`).join("")
    : `<p class="small" style="color:var(--green);">All tracked chapters at 70%+ — nice.</p>`;
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function startSession(){
  const ch=selectedChapters();
  if(!ch.length){ alert("Select at least one chapter."); return; }
  const count=parseInt($("count-select").value,10);
  const pool=QUESTIONS.map((q,i)=>({...q,qid:i})).filter(q=>ch.includes(q.chapter));
  session=shuffle(pool).slice(0,count);
  if(!session.length){ alert("No questions for the selected chapters."); return; }
  idx=0; score=0; wrong=0;
  setupScreen.classList.add("hidden"); doneScreen.classList.add("hidden"); quizScreen.classList.remove("hidden");
  showQuestion(); updateDash();
}
function showQuestion(){
  const q=session[idx];
  $("feedback").className="feedback"; $("next-btn").classList.add("hidden");
  $("q-chapter").textContent=q.chapter; $("q-acs").textContent=q.acs_code||"";
  $("q-text").textContent=(idx+1)+". "+q.question_text;
  const box=$("options"); box.innerHTML="";
  ["A","B","C"].forEach(opt=>{
    const b=document.createElement("button");
    b.className="opt"; b.innerHTML=`<strong>${opt}.</strong> ${q["option_"+opt.toLowerCase()]}`;
    b.onclick=()=>answer(opt,b);
    box.appendChild(b);
  });
  updateDash();
}
function answer(opt,btn){
  const q=session[idx];
  const correct=(opt===q.correct_option);
  if(correct) score++; else wrong++;
  saveAttempt({qid:q.qid, answer:opt, correct:correct?1:0, ts:Date.now()});
  [...$("options").children].forEach(b=>{ b.disabled=true;
    const letter=b.querySelector("strong").textContent.replace(".","");
    if(letter===q.correct_option) b.classList.add("correct");
    else if(b===btn) b.classList.add("wrong");
    else b.classList.add("dim");
  });
  const fb=$("feedback");
  fb.className="feedback show "+(correct?"good":"bad");
  $("fb-title").textContent=correct?"Correct!":`Not quite — answer: ${q.correct_option}`;
  $("fb-body").textContent=q.explanation||"";
  $("next-btn").classList.remove("hidden");
  updateDash();
}
function updateDash(){
  const att=score+wrong, pct=att?Math.round(score/att*100):0;
  const ds=$("d-score"); ds.textContent=pct+"%";
  ds.style.color=(pct>=70||att===0)?"var(--green)":"var(--red)";
  $("d-wrong").textContent=wrong;
  $("d-prog").textContent=Math.min(idx+1,session.length)+"/"+session.length;
}
function next(){
  idx++;
  if(idx>=session.length){ finish(); return; }
  showQuestion();
}
function finish(){
  quizScreen.classList.add("hidden"); doneScreen.classList.remove("hidden");
  const att=score+wrong, pct=att?Math.round(score/att*100):0;
  const fs=$("final-score"); fs.textContent=pct+"%";
  fs.style.color=pct>=70?"var(--green)":"var(--red)";
  $("final-detail").textContent=`${score} correct, ${wrong} wrong, out of ${session.length}.`;
  $("final-note").textContent=pct>=70
    ? "At or above the 70% FAA passing mark. Keep drilling your weak chapters."
    : "Below the 70% FAA passing mark — review the explanations and run it back.";
  renderWeak("weak-chapters-2");
}
function toSetup(){
  doneScreen.classList.add("hidden"); quizScreen.classList.add("hidden"); setupScreen.classList.remove("hidden");
  renderWeak("weak-chapters");
}

$("start-btn").onclick=startSession;
$("next-btn").onclick=next;
$("quit-btn").onclick=toSetup;
$("again-btn").onclick=toSetup;
$("reset-history-btn").onclick=()=>{
  if(confirm("Clear all saved answer history?")){ localStorage.removeItem(LS_KEY); renderWeak("weak-chapters"); }
};
if("serviceWorker" in navigator){ window.addEventListener("load",()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); }); }
renderChapterFilters(); renderWeak("weak-chapters");
</script>
</body>
</html>
