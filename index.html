<style>
:root{
  --bg:#0f172a; --card:#1e293b; --card2:#273449; --text:#f1f5f9; --muted:#94a3b8;
  --green:#10b981; --red:#ef4444; --amber:#f59e0b; --accent:#38bdf8; --border:#334155;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:17px; line-height:1.5; padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
header{padding:1rem 1rem .5rem; border-bottom:1px solid var(--border);}
header h1{font-size:1.25rem; margin:0;}
header p{margin:.15rem 0 0; color:var(--muted); font-size:.85rem;}
main{padding:1rem; max-width:720px; margin:0 auto;}
.card{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:1rem; margin-bottom:1rem;}
.dash{display:grid; grid-template-columns:1fr 1fr 1fr; gap:.75rem; text-align:center; margin-bottom:1rem;}
.dash .stat{background:var(--card); border:1px solid var(--border); border-radius:12px; padding:.6rem .25rem;}
.dash small{color:var(--muted); font-size:.7rem; letter-spacing:.05em;}
.dash .val{font-size:1.4rem; font-weight:700; margin:0;}
#q-meta{display:flex; justify-content:space-between; align-items:center; gap:.5rem; margin-bottom:.6rem;}
#q-chapter{background:var(--card2); border-radius:8px; padding:.2rem .6rem; font-size:.8rem;}
#q-acs{font-family:ui-monospace,monospace; font-size:.75rem; color:var(--muted);}
#q-text{font-size:1.08rem; font-weight:600; margin:.4rem 0 1rem;}
.opt{
  display:block; width:100%; text-align:left; font-size:1rem;
  background:var(--card2); color:var(--text);
  border:2px solid var(--border); border-radius:12px;
  padding:.9rem 1rem; margin-bottom:.6rem; cursor:pointer;
}
.opt:active{transform:scale(.99);}
.opt:disabled{opacity:.85; cursor:default;}
.opt.correct{border-color:var(--green); background:#064e3b;}
.opt.wrong{border-color:var(--red); background:#7f1d1d;}
.opt.dim{opacity:.55;}
.feedback{border-radius:12px; padding:.9rem 1rem; margin:.8rem 0; display:none;}
.feedback.show{display:block;}
.feedback.good{background:#064e3b; border:1px solid var(--green);}
.feedback.bad{background:#7f1d1d; border:1px solid var(--red);}
.feedback strong{display:block; margin-bottom:.3rem;}
.btn{
  display:block; width:100%; font-size:1.05rem; font-weight:700;
  background:var(--accent); color:#082f49; border:none; border-radius:12px;
  padding:.9rem; cursor:pointer; margin-top:.4rem;
}
.btn.secondary{background:var(--card2); color:var(--text); border:1px solid var(--border);}
.row{display:flex; gap:.6rem;}
.row .btn{margin-top:0;}
select{
  width:100%; font-size:1rem; background:var(--card2); color:var(--text);
  border:1px solid var(--border); border-radius:10px; padding:.7rem; margin-bottom:.6rem;
}
.chapter-row{display:flex; align-items:center; gap:.6rem; padding:.55rem 0; border-bottom:1px solid var(--border); font-size:.95rem;}
.chapter-row:last-child{border-bottom:none;}
.chapter-row input{width:1.35rem; height:1.35rem; accent-color:var(--accent);}
.weak-row{display:flex; justify-content:space-between; padding:.35rem 0; border-bottom:1px solid var(--border); font-size:.9rem;}
.weak-row:last-child{border-bottom:none;}
.hidden{display:none !important;}
.done{text-align:center; padding:2rem 1rem;}
.done .big{font-size:3rem; margin-bottom:.5rem;}
.small{color:var(--muted); font-size:.85rem;}
h3.sec{font-size:1rem; margin:0 0 .4rem;}
</style>
</head>
<body>
<header>
  <h1>&#128752; Part 107 Study</h1>
  <p>FAA Remote Pilot exam prep &mdash; offline</p>
</header>
<main>
  <!-- SETUP SCREEN -->
  <div id="setup-screen">
    <div class="card">
      <h3 class="sec">Study session</h3>
      <select id="count-select">
        <option value="10">10 questions</option>
        <option value="20" selected>20 questions</option>
        <option value="60">60 questions (full exam)</option>
      </select>
      <h3 class="sec" style="margin-top:.8rem;">Chapters</h3>
      <div id="chapter-filters"></div>
      <button class="btn" id="start-btn" style="margin-top:1rem;">Start session</button>
    </div>
    <div class="card">
      <h3 class="sec">Chapters needing work</h3>
      <div id="weak-chapters"><p class="small">Answer questions to track accuracy per chapter.</p></div>
      <div class="row" style="margin-top:.8rem;">
        <button class="btn secondary" id="reset-history-btn">Clear history</button>
      </div>
    </div>
  </div>

  <!-- QUIZ SCREEN -->
  <div id="quiz-screen" class="hidden">
    <div class="dash">
      <div class="stat"><small>SCORE</small><p class="val" id="d-score" style="color:var(--green);">0%</p></div>
      <div class="stat"><small>WRONG</small><p class="val" id="d-wrong" style="color:var(--red);">0</p></div>
      <div class="stat"><small>PROGRESS</small><p class="val" id="d-prog">0/0</p></div>
    </div>
    <div class="card">
      <div id="q-meta"><span id="q-chapter"></span><span id="q-acs"></span></div>
      <p id="q-text"></p>
      <div id="options"></div>
      <div id="feedback" class="feedback"><strong id="fb-title"></strong><p id="fb-body" style="margin:.3rem 0 0;"></p></div>
      <button class="btn hidden" id="next-btn">Next question &rarr;</button>
    </div>
    <button class="btn secondary" id="quit-btn">End session</button>
  </div>

  <!-- DONE SCREEN -->
  <div id="done-screen" class="hidden">
    <div class="card done">
      <div class="big">&#127937;</div>
      <h2 style="margin:.2rem 0;">Session complete</h2>
      <p class="val" id="final-score" style="font-size:2.2rem; font-weight:800;"></p>
      <p class="small" id="final-detail"></p>
      <p class="small" id="final-note" style="margin-top:.6rem;"></p>
      <button class="btn" id="again-btn" style="margin-top:1rem;">New session</button>
    </div>
    <div class="card">
      <h3 class="sec">Chapters needing work</h3>
      <div id="weak-chapters-2"></div>
    </div>
  </div>
</main>
<script>
"use strict";
const QUESTIONS = [{"chapter":"Regulations & Operations","acs_code":"UA.I.A.K1","question_text":"According to 14 CFR part 107, who is directly responsible for the safe operation of a small unmanned aircraft system?","option_a":"The visual observer (VO)","option_b":"The Remote Pilot in Command (Remote PIC)","option_c":"The FAA inspector","correct_option":"B","explanation":"Part 107.19 states the Remote PIC is directly responsible for and is the final authority as to the operation of the sUAS."},{"chapter":"Regulations & Operations","acs_code":"UA.I.A.K5","question_text":"When must a remote pilot report an sUAS accident to the FAA?","option_a":"Within 10 calendar days if damage exceeds $500 to repair non-drone property or causes serious injury","option_b":"Within 3 business days for any crash","option_c":"Within 30 days regardless of damage","correct_option":"A","explanation":"Part 107.9 requires reporting within 10 days if serious injury/loss of consciousness occurs, or property damage exceeds $500."},{"chapter":"Regulations & Operations","acs_code":"UA.I.A.K1","question_text":"What is the maximum allowable groundspeed for a small unmanned aircraft under Part 107?","option_a":"80 knots (92 mph)","option_b":"87 knots (100 mph)","option_c":"100 knots (115 mph)","correct_option":"B","explanation":"Part 107.51 limits maximum groundspeed to 87 knots (100 mph)."},{"chapter":"Regulations & Operations","acs_code":"UA.I.A.K1","question_text":"What is the maximum altitude a remote pilot can fly without a waiver when not near a structure?","option_a":"300 feet AGL","option_b":"400 feet AGL","option_c":"500 feet AGL","correct_option":"B","explanation":"Maximum altitude is 400 feet AGL unless operating within a 400-foot radius of a structure."},{"chapter":"Regulations & Operations","acs_code":"UA.I.A.K1","question_text":"If flying within a 400-foot radius of a 300-foot tall tower, what is the maximum allowable altitude?","option_a":"400 feet AGL","option_b":"700 feet AGL","option_c":"500 feet AGL","correct_option":"B","explanation":"You may fly up to 400 feet above the top of the structure (300 ft tower + 400 ft = 700 ft AGL)."},{"chapter":"Regulations & Operations","acs_code":"UA.I.A.K2","question_text":"What is the minimum age required to eligible for a Part 107 Remote Pilot Certificate?","option_a":"14 years old","option_b":"16 years old","option_c":"18 years old","correct_option":"B","explanation":"An applicant must be at least 16 years of age to be issued a Remote Pilot Certificate under Part 107.61."},{"chapter":"Regulations & Operations","acs_code":"UA.I.A.K3","question_text":"How long is a Part 107 Remote Pilot Certificate valid before requiring recurrent training?","option_a":"12 calendar months","option_b":"24 calendar months","option_c":"36 calendar months","correct_option":"B","explanation":"Remote pilots must complete recurrent training every 24 calendar months to maintain currency."},{"chapter":"Regulations & Operations","acs_code":"UA.I.A.K4","question_text":"Under Part 107, what is the maximum weight allowed for a small unmanned aircraft including payload?","option_a":"Less than 55 pounds","option_b":"Exactly 55 pounds","option_c":"Up to 75 pounds","correct_option":"A","explanation":"Part 107 defines a small UA as weighing less than 55 lbs (54.99 lbs or under) at takeoff."},{"chapter":"Regulations & Operations","acs_code":"UA.I.B.K1","question_text":"When must a recreational or commercial drone weighing over 0.55 lbs be registered with the FAA?","option_a":"Prior to initial operation in the United States","option_b":"Within 10 days of first flight","option_c":"Only if used for commercial filming","correct_option":"A","explanation":"14 CFR Part 48 requires sUAS over 0.55 lbs to be registered before operating in US airspace."},{"chapter":"Regulations & Operations","acs_code":"UA.I.B.K1","question_text":"How long is an FAA drone registration valid for commercial operations under Part 107?","option_a":"1 year","option_b":"3 years","option_c":"5 years","correct_option":"B","explanation":"Commercial sUAS registrations under Part 48 are valid for 3 years."},{"chapter":"Regulations & Operations","acs_code":"UA.I.B.K6b","question_text":"May a remote pilot allow objects to be dropped from an sUAS in flight?","option_a":"No, object dropping is strictly prohibited under all circumstances","option_b":"Yes, provided it does not create an undue hazard to persons or property","option_c":"Yes, if flying below 100 feet AGL","correct_option":"B","explanation":"Part 107.23 allows dropping objects if reasonable precautions are taken to avoid hazard to people or property."},{"chapter":"Regulations & Operations","acs_code":"UA.I.B.K9","question_text":"Under Part 107, night operations require the sUAS to be equipped with anti-collision lighting visible for at least:","option_a":"1 statute mile","option_b":"2 statute miles","option_c":"3 statute miles","correct_option":"C","explanation":"Night and civil twilight flights require anti-collision lights visible for at least 3 statute miles with a flash rate sufficient to avoid collision."},{"chapter":"Regulations & Operations","acs_code":"UA.I.B.K9","question_text":"Civil twilight is defined as the period:","option_a":"30 minutes before official sunrise and 30 minutes after official sunset","option_b":"1 hour after sunset","option_c":"Between 10:00 PM and 5:00 AM local time","correct_option":"A","explanation":"Civil twilight runs 30 min before sunrise and 30 min after sunset (requires 3 SM anti-collision lights)."},{"chapter":"Regulations & Operations","acs_code":"UA.I.B.K14a","question_text":"Which technique should a remote pilot use to scan for traffic during daytime flight?","option_a":"Continuously sweep eyes across the horizon","option_b":"Systematically focus on different segments of the sky for short intervals","option_c":"Stare at the drone at all times","correct_option":"B","explanation":"Effective visual scanning relies on focused fixation in 10-degree overlapping sectors across the sky."},{"chapter":"Regulations & Operations","acs_code":"UA.I.B.K16","question_text":"What is required before operating an sUAS in Class B, C, or D controlled airspace?","option_a":"Prior ATC authorization through LAANC or DroneZone","option_b":"Filing a flight plan with FSS","option_c":"A verbal phone call to airport management","correct_option":"A","explanation":"Operations in Class B, C, D, or surface Class E controlled airspace require ATC authorization prior to flight."},{"chapter":"Regulations & Operations","acs_code":"UA.I.B.K20","question_text":"Who is responsible for determining whether the sUAS is in a condition for safe operation?","option_a":"The manufacturer","option_b":"The Remote PIC","option_c":"The FAA airworthiness inspector","correct_option":"B","explanation":"Part 107.15 specifies the Remote PIC must perform pre-flight checks to ensure safe operating condition."},{"chapter":"Regulations & Operations","acs_code":"UA.I.B.K21a","question_text":"Under what condition may a Remote PIC deviate from Part 107 rules?","option_a":"In an in-flight emergency requiring immediate action","option_b":"If the client requests urgent footage","option_c":"Deviations are never permitted under any circumstance","correct_option":"A","explanation":"Part 107.21 grants emergency authority to deviate from any rule to the extent necessary to handle the emergency."},{"chapter":"Regulations & Operations","acs_code":"UA.I.A.K1","question_text":"A person manipulating controls without a Remote Pilot Certificate must be supervised by a Remote PIC who is:","option_a":"Located anywhere on the job site","option_b":"Directly assisted by a visual observer","option_c":"Able to take immediate direct control of the sUAS","correct_option":"C","explanation":"Supervision requires the certificated Remote PIC to be positioned to immediately take physical control if needed."},{"chapter":"Regulations & Operations","acs_code":"UA.I.A.K1","question_text":"Under 14 CFR Part 107, what is the blood alcohol concentration limit for a remote pilot?","option_a":".02 percent","option_b":".04 percent","option_c":".08 percent","correct_option":"B","explanation":"Part 107.27 prohibits operating an sUAS with a BAC of .04 percent or higher or within 8 hours of alcohol consumption."},{"chapter":"Regulations & Operations","acs_code":"UA.I.A.K1","question_text":"How many hours must elapse after consuming alcohol before acting as a Remote PIC or crew member?","option_a":"8 hours","option_b":"12 hours","option_c":"24 hours","correct_option":"A","explanation":"Rule 14 CFR \u00a7 91.17 / Part 107 specifies '8 hours bottle to throttle.'"},{"chapter":"Airspace & Charts","acs_code":"UA.I.B.K1","question_text":"Refer to Sectional Charts. What does a dashed magenta line around an airport indicate?","option_a":"Class E surface area airspace beginning at the surface","option_b":"Class D controlled airspace up to 2,500 ft MSL","option_c":"National Security Area","correct_option":"A","explanation":"Dashed magenta lines designate Class E airspace extending upward from the surface."},{"chapter":"Airspace & Charts","acs_code":"UA.I.B.K1","question_text":"What is the typical ceiling of Class D airspace above an airport elevation?","option_a":"1,200 feet AGL","option_b":"2,500 feet AGL","option_c":"4,000 feet AGL","correct_option":"B","explanation":"Class D airspace typically extends from the surface up to 2,500 feet above the airport elevation (AGL)."},{"chapter":"Airspace & Charts","acs_code":"UA.I.B.K1","question_text":"Class B airspace on sectional charts is depicted by:","option_a":"Solid blue lines","option_b":"Solid magenta lines","option_c":"Dashed blue lines","correct_option":"A","explanation":"Class B airspace surrounding major hubs is charted with solid blue boundaries."},{"chapter":"Airspace & Charts","acs_code":"UA.I.B.K1","question_text":"Class C airspace on sectional charts is depicted by:","option_a":"Solid magenta lines","option_b":"Solid blue lines","option_c":"Dashed magenta lines","correct_option":"A","explanation":"Class C airspace surrounding mid-sized airports with tower control is depicted in solid magenta."},{"chapter":"Airspace & Charts","acs_code":"UA.I.B.K21b","question_text":"What is the floor of Class E airspace in an area shaded by a magenta vignette?","option_a":"Surface","option_b":"700 feet AGL","option_c":"1,200 feet AGL","correct_option":"B","explanation":"Faded magenta vignette lowers the Class E floor from 1,200 ft AGL down to 700 ft AGL."},{"chapter":"Airspace & Charts","acs_code":"UA.I.B.K21b","question_text":"Outside of shaded magenta areas, Class E airspace over the US generally begins at:","option_a":"700 feet AGL","option_b":"1,200 feet AGL","option_c":"14,500 feet MSL","correct_option":"B","explanation":"Unless otherwise designated at a lower altitude, Class E airspace starts at 1,200 feet AGL."},{"chapter":"Airspace & Charts","acs_code":"UA.I.B.K1","question_text":"Uncontrolled airspace extending from the surface up to the base of overlying controlled airspace is:","option_a":"Class E airspace","option_b":"Class G airspace","option_c":"Class D airspace","correct_option":"B","explanation":"Class G airspace is defined as uncontrolled airspace."},{"chapter":"Airspace & Charts","acs_code":"UA.I.C.K4","question_text":"What frequency is used as CTAF at non-towered airports when UNICOM is not listed?","option_a":"122.8 MHz","option_b":"121.5 MHz","option_c":"123.6 MHz","correct_option":"A","explanation":"122.8 MHz is the standard default UNICOM/CTAF frequency for non-towered airports."},{"chapter":"Airspace & Charts","acs_code":"UA.I.C.K4","question_text":"MULTICOM frequency used for air-to-air communication at non-towered airports without UNICOM is:","option_a":"122.7 MHz","option_b":"122.9 MHz","option_c":"123.0 MHz","correct_option":"B","explanation":"122.9 MHz is the standard MULTICOM frequency."},{"chapter":"Airspace & Charts","acs_code":"UA.I.B.K1","question_text":"Military Operations Areas (MOAs) on sectional charts warn pilots of:","option_a":"Restricted laser hazards","option_b":"Military training activities that require extreme caution","option_c":"Prohibited flight zones","correct_option":"B","explanation":"MOAs contain high-speed military training flight activity. Prior ATC permission isn't required for Part 107 but extreme caution is mandatory."},{"chapter":"Airspace & Charts","acs_code":"UA.I.B.K1","question_text":"Can a remote pilot operate an sUAS in a Restricted Area without permission?","option_a":"Yes, if flying under 100 feet AGL","option_b":"No, operations in Restricted Areas require authorization from the controlling agency","option_c":"Yes, during daytime civil twilight only","correct_option":"B","explanation":"Restricted areas contain invisible hazards; flight requires explicit controlling agency authorization."},{"chapter":"Airspace & Charts","acs_code":"UA.I.B.K1","question_text":"Prohibited Areas depicted on sectional charts with a 'P' followed by a number signify:","option_a":"Airspace where aircraft flight is completely prohibited for national security","option_b":"Private agricultural flight zones","option_c":"Parachute drop zones","correct_option":"A","explanation":"Prohibited areas (e.g., P-40 around Camp David) strictly forbid aircraft operations."},{"chapter":"Airspace & Charts","acs_code":"UA.I.C.K4","question_text":"In a sectional chart legend, a magenta flag symbol indicates a:","option_a":"Visual reporting checkpoint for manned aircraft traffic","option_b":"Obstacle taller than 1,000 feet AGL","option_c":"Seaplane base","correct_option":"A","explanation":"Flag symbols mark prominent visual checkpoints used by manned pilots to identify traffic locations near airports."},{"chapter":"Airspace & Charts","acs_code":"UA.I.C.K4","question_text":"On a sectional chart, an obstacle elevation fraction listed as '1568 (1169)' means:","option_a":"Top of obstacle is 1,568 ft MSL and 1,169 ft AGL","option_b":"1,568 ft AGL and 1,169 ft MSL","option_c":"Base elevation is 1,568 ft MSL","correct_option":"A","explanation":"Top number is height above mean sea level (MSL); lower bracketed number is height above ground level (AGL)."},{"chapter":"Airspace & Charts","acs_code":"UA.I.C.K4","question_text":"Blue dashed lines surrounding an airport on a sectional chart depict:","option_a":"Class D controlled airspace","option_b":"Class E surface airspace","option_c":"Military Training Route","correct_option":"A","explanation":"Dashed blue lines outline Class D surface controlled airspace around towered airports."},{"chapter":"Weather & METARs","acs_code":"UA.II.A.K1c","question_text":"What weather phenomenon is characterized by a sudden, drastic change in wind speed and/or direction?","option_a":"Wind shear","option_b":"Microburst","option_c":"Thermal updraft","correct_option":"A","explanation":"Wind shear is a violent change in wind velocity or direction over a short distance."},{"chapter":"Weather & METARs","acs_code":"UA.II.B.K3","question_text":"In a METAR report, what does 'SPECI' indicate?","option_a":"A scheduled hourly observation","option_b":"A special unscheduled observation for rapid weather changes","option_c":"A specifiably clear report","correct_option":"B","explanation":"SPECI designates a special unscheduled report issued when significant weather changes occur between hourly reports."},{"chapter":"Weather & METARs","acs_code":"UA.II.B.K5","question_text":"What effect does high density altitude have on drone flight performance?","option_a":"Increases lift and propeller efficiency","option_b":"Decreases air density, reducing rotor lift and battery performance","option_c":"Has no impact on electric motor performance","correct_option":"B","explanation":"High density altitude means thin air, which decreases propeller thrust, lift efficiency, and increases battery discharge rates."},{"chapter":"Weather & METARs","acs_code":"UA.II.A.K1d","question_text":"What combination of atmospheric conditions leads to high density altitude?","option_a":"High temperature, high humidity, and high elevation","option_b":"Low temperature and high barometric pressure","option_c":"Low elevation and dry air","correct_option":"A","explanation":"Hot temperature, high humidity, and high elevation reduce air mass density, creating high density altitude."},{"chapter":"Weather & METARs","acs_code":"UA.II.A.K1d","question_text":"What is required for a thunderstorm to form?","option_a":"Sufficient water vapor, unstable airmass, and an initial lifting force","option_b":"Dry air, high pressure, and calm winds","option_c":"Freezing ground temperatures and wind shear","correct_option":"A","explanation":"Thunderstorm creation requires moisture, convective instability, and a lifting mechanism (front, terrain, heat)."},{"chapter":"Weather & METARs","acs_code":"UA.II.A.K1d","question_text":"What weather condition is associated with a temperature inversion?","option_a":"Smooth air with reduced visibility due to trapped fog or haze","option_b":"Severe turbulent updrafts and thunderstorm clouds","option_c":"Rapidly dropping air density","correct_option":"A","explanation":"Inversions trap cool air beneath warm air, creating stable but hazy air with low surface visibility."},{"chapter":"Weather & METARs","acs_code":"UA.II.B.K3","question_text":"In METAR string '18004KT 3SM RA OVC010', what does 'OVC010' mean?","option_a":"Overcast clouds at 10,000 feet AGL","option_b":"Overcast ceiling at 1,000 feet AGL","option_c":"Overcast layer at 100 feet AGL","correct_option":"B","explanation":"Cloud heights are coded in hundreds of feet AGL; 010 equals 1,000 feet AGL."},{"chapter":"Weather & METARs","acs_code":"UA.II.B.K3","question_text":"In a METAR text report, 'SKC' or 'CLR' indicates:","option_a":"Sky Clear (no cloud layers detected below 12,000 ft)","option_b":"Scattered low clouds","option_c":"Severe squall conditions","correct_option":"A","explanation":"SKC/CLR means sky clear."},{"chapter":"Weather & METARs","acs_code":"UA.II.B.K3","question_text":"What constitute a cloud 'ceiling' under aviation weather definitions?","option_a":"Any cloud layer regardless of coverage","option_b":"The lowest broken (BKN) or overcast (OVC) cloud layer","option_c":"Thin scattered cloud layers at high altitude","correct_option":"B","explanation":"Ceiling is defined as the lowest layer reported as broken (BKN) or overcast (OVC)."},{"chapter":"Weather & METARs","acs_code":"UA.II.B.K3","question_text":"In a METAR report, wind direction is reported in reference to:","option_a":"Magnetic North","option_b":"True North","option_c":"Grid North","correct_option":"B","explanation":"Rule of thumb: 'If you READ it, it's TRUE (True North); if you HEAR it over radio, it's MAGNETIC.'"},{"chapter":"Weather & METARs","acs_code":"UA.II.B.K3","question_text":"What does 'VRB03KT' in a METAR report signify?","option_a":"Vertical wind shear at 3 knots","option_b":"Variable wind direction at 3 knots","option_c":"Visibility reduced by 3 miles","correct_option":"B","explanation":"VRB indicates variable wind direction when speed is low (3 knots)."},{"chapter":"Weather & METARs","acs_code":"UA.II.B.K3","question_text":"What is a Terminal Aerodrome Forecast (TAF)?","option_a":"A concise 24 to 30 hour forecast of expected weather conditions at an airport","option_b":"An hourly surface observation report","option_c":"A regional upper-air radar image","correct_option":"A","explanation":"TAF provides airport weather forecasts updated 4 times daily for a 24-30 hour window."},{"chapter":"Weather & METARs","acs_code":"UA.II.A.K1c","question_text":"Advection fog is formed when:","option_a":"Warm, moist air moves over a cool land or water surface","option_b":"Terrestrial radiation cools the ground on calm nights","option_c":"Rain falls through cold surface air","correct_option":"A","explanation":"Advection fog forms when moist air moves horizontally over a colder underlying surface."},{"chapter":"Weather & METARs","acs_code":"UA.II.A.K1c","question_text":"Radiation fog is most likely to form during:","option_a":"Warm cloudy days with strong winds","option_b":"Clear, calm nights over land surfaces","option_c":"Mountainous windward slopes","correct_option":"B","explanation":"Radiation fog occurs on clear, windless nights as ground heat radiates into space."},{"chapter":"Weather & METARs","acs_code":"UA.II.A.K1c","question_text":"Structural icing on an sUAS airframe requires what two conditions?","option_a":"Visible moisture and temperatures at or below freezing (0\u00b0C / 32\u00b0F)","option_b":"High humidity and strong wind shear","option_c":"Freezing ground fog above 50\u00b0F","correct_option":"A","explanation":"Icing forms when supercooled liquid water drops adhere to an airframe at or below freezing temps."},{"chapter":"Operations & Safety","acs_code":"UA.V.C.K2","question_text":"What action should a remote pilot take if a LiPo battery begins to swell or undergo thermal runaway?","option_a":"Disconnect it immediately and place it in a fire-safe container in a ventilated area","option_b":"Pour cold water directly onto the cells","option_c":"Store it tightly wrapped in plastic","correct_option":"A","explanation":"Thermal runaway creates self-sustaining heat and explosive gases. Isolate in a fireproof container."},{"chapter":"Operations & Safety","acs_code":"UA.V.E.K5","question_text":"Which hazardous attitude is represented by a pilot who believes 'It won't happen to me'?","option_a":"Invulnerability","option_b":"Macho","option_c":"Resignation","correct_option":"A","explanation":"Invulnerability is the mistaken belief that accidents only happen to other people."},{"chapter":"Operations & Safety","acs_code":"UA.V.E.K5","question_text":"What is the antidote for the hazardous attitude 'Macho' ('I can do it')?","option_a":"Taking chances is foolish","option_b":"It could happen to me","option_c":"Not helpless","correct_option":"A","explanation":"The antidote for Macho is reminding yourself that taking foolish risks is foolish, not brave."},{"chapter":"Operations & Safety","acs_code":"UA.V.E.K5","question_text":"What is the antidote for the hazardous attitude 'Impulsivity' ('Do it quickly')?","option_a":"Not so fast, think first","option_b":"Follow the rules","option_c":"I am in control","correct_option":"A","explanation":"Impulsivity antidote: 'Not so fast, think first' before acting."},{"chapter":"Operations & Safety","acs_code":"UA.V.E.K5","question_text":"What is the antidote for the hazardous attitude 'Resignation' ('What's the use?')?","option_a":"I am not helpless. I can make a difference","option_b":"It could happen to me","option_c":"Follow procedures","correct_option":"A","explanation":"Resignation antidote: 'I am not helpless. I can make a difference.'"},{"chapter":"Operations & Safety","acs_code":"UA.V.E.K5","question_text":"What is the antidote for 'Anti-Authority' ('Don't tell me')?","option_a":"Follow the rules. They are usually right","option_b":"Think first","option_c":"Take chances","correct_option":"A","explanation":"Anti-Authority antidote: 'Follow the rules. They are usually right.'"},{"chapter":"Operations & Safety","acs_code":"UA.V.F.K4","question_text":"Who is responsible for establishing sUAS maintenance schedules if none are provided by the manufacturer?","option_a":"The Remote PIC","option_b":"The FAA local FSDO","option_c":"The retail distributor","correct_option":"A","explanation":"Part 107 requires the Remote PIC to establish maintenance and inspection procedures if manufacturer guidance lacks."},{"chapter":"Operations & Safety","acs_code":"UA.V.E.K2","question_text":"Hyperventilation caused by anxiety or stress can be corrected by:","option_a":"Slowing the breathing rate or breathing into a paper bag","option_b":"Taking rapid deep breaths","option_c":"Consuming caffeine","correct_option":"A","explanation":"Hyperventilation expels excessive CO2; slowing breathing restores normal blood gas levels."},{"chapter":"Operations & Safety","acs_code":"UA.V.E.K2","question_text":"What is spatial disorientation?","option_a":"A state of temporary confusion resulting from the inability to determine true orientation relative to the earth","option_b":"Inability to read sectional charts accurately","option_c":"Loss of radio connection","correct_option":"A","explanation":"Spatial disorientation occurs when visual or vestibular senses misinterpret aircraft position."},{"chapter":"Operations & Safety","acs_code":"UA.V.E.K2","question_text":"To adapt eyes for night vision flying, a pilot should avoid bright light for at least:","option_a":"10 minutes","option_b":"30 minutes","option_c":"60 minutes","correct_option":"B","explanation":"Full night adaptation of eye rods requires approximately 30 minutes in low light conditions."},{"chapter":"Operations & Safety","acs_code":"UA.V.D.K1","question_text":"In Crew Resource Management (CRM), effective communication among crew members depends on:","option_a":"Clear, concise briefings and active structured feedback","option_b":"Unspoken assumptions","option_c":"Relying entirely on the visual observer","correct_option":"A","explanation":"CRM emphasizes clear verbal briefings, role assignments, and structured communication."},{"chapter":"Operations & Safety","acs_code":"UA.V.C.K1","question_text":"What is the primary step during an in-flight control link failure (flyaway)?","option_a":"Execute lost-link procedures and monitor automated RTH fail-safe tracking","option_b":"Turn off the remote controller immediately","option_c":"Sprint toward the last known coordinates","correct_option":"A","explanation":"Remote PIC should monitor predefined fail-safe automated Return-to-Home behavior."},{"chapter":"Operations & Safety","acs_code":"UA.V.F.K4","question_text":"Pre-flight checks of sUAS battery systems should include inspecting for:","option_a":"Swelling, cracks, loose wiring, or corrosion on connectors","option_b":"Propeller brand logos","option_c":"Aeronautical chart dates","correct_option":"A","explanation":"Physical inspections guard against battery degradation and inflight power failure."},{"chapter":"Operations & Safety","acs_code":"UA.V.B.K6a","question_text":"Under Part 107, what is the minimum flight visibility requirement?","option_a":"1 statute mile","option_b":"3 statute miles","option_c":"5 statute miles","correct_option":"B","explanation":"Minimum flight visibility must be at least 3 statute miles from the control station location."},{"chapter":"Operations & Safety","acs_code":"UA.V.B.K6a","question_text":"What are the cloud clearance requirements for Part 107 flight?","option_a":"At least 500 feet below clouds and 2,000 feet horizontally","option_b":"1,000 feet above and 500 feet below","option_c":"Clear of clouds only","correct_option":"A","explanation":"Part 107.51 requires staying 500 ft below clouds and 2,000 ft horizontally."},{"chapter":"Loading & Performance","acs_code":"UA.II.B.K4b","question_text":"If a drone weighs 3 lbs and experiences a 60-degree banked level turn, what dynamic load factor acts on the airframe?","option_a":"3 lbs","option_b":"4.2 lbs","option_c":"6 lbs","correct_option":"C","explanation":"A 60-degree banked turn creates a 2.0 G load factor, doubling effective weight (3 lbs x 2.0 = 6 lbs)."},{"chapter":"Loading & Performance","acs_code":"UA.II.B.K4b","question_text":"A 30-degree bank angle increases the load factor on an aircraft by approximately:","option_a":"15 percent (1.15 Gs)","option_b":"50 percent (1.5 Gs)","option_c":"100 percent (2.0 Gs)","correct_option":"A","explanation":"At a 30-degree bank, load factor is 1.15 Gs (a 15% effective weight increase)."},{"chapter":"Loading & Performance","acs_code":"UA.III.B.K1j","question_text":"What is the primary operational hazard of flying an sUAS with an aft (rearward) Center of Gravity (CG)?","option_a":"Aircraft becomes unstable and difficult to recover from maneuvers","option_b":"Increased battery power efficiency","option_c":"Faster horizontal top speeds","correct_option":"A","explanation":"An overly aft CG reduces pitch control stability, making flight erratic."},{"chapter":"Loading & Performance","acs_code":"UA.III.B.K1j","question_text":"What happens when an sUAS is loaded beyond its maximum takeoff weight rating?","option_a":"Decreased maneuverability, shorter battery flight time, and higher stall speed","option_b":"Improved glide ratio","option_c":"Higher ceiling climb rates","correct_option":"A","explanation":"Overloading strains motors, degrades control responses, and drastically cuts battery duration."},{"chapter":"Loading & Performance","acs_code":"UA.III.B.K1j","question_text":"Before attaching a new camera payload to an sUAS, the remote pilot should confirm:","option_a":"The total weight remains under 55 lbs and CG is within manufacturer limits","option_b":"The camera brand is FAA approved","option_c":"The SD card is reformatted","correct_option":"A","explanation":"Payload checks ensure weight limits and balance limits remain within safe tolerances."},{"chapter":"Loading & Performance","acs_code":"UA.II.B.K4b","question_text":"What effect does extreme cold weather have on LiPo battery performance?","option_a":"Reduces chemical activity, causing rapid voltage drop and shorter flight times","option_b":"Increases battery capacity","option_c":"Has zero impact on lithium cell chemistry","correct_option":"A","explanation":"Cold temperatures slow chemical discharge rates, causing severe voltage drops under load."},{"chapter":"Loading & Performance","acs_code":"UA.III.B.K1j","question_text":"How should damaged or swollen LiPo batteries be stored prior to safe recycling?","option_a":"Discharged and isolated in a fireproof container away from flammables","option_b":"Fully charged in a sealed wooden box","option_c":"Submerged in engine oil","correct_option":"A","explanation":"Damaged LiPos should be safely discharged and kept isolated in fireproof containers."},{"chapter":"Loading & Performance","acs_code":"UA.II.B.K4b","question_text":"When operating an sUAS at high altitudes near mountains, a pilot must account for:","option_a":"Reduced air density requiring more rotor power to generate lift","option_b":"Decreased motor heat","option_c":"Increased propeller efficiency","correct_option":"A","explanation":"Thin mountain air forces electric motors to spin faster to maintain equivalent lift."},{"chapter":"Regulations & Operations","acs_code":"UA.I.A.K1","question_text":"Which operation is exempt from the Remote ID broadcast requirement under Part 89?","option_a":"Flights within an FAA-recognized identification area (FRIA)","option_b":"Flights below 200 ft AGL","option_c":"Flights with a visual observer","correct_option":"A","explanation":"Part 89 exempts operations inside a FRIA; all other Part 107 flights need Standard Remote ID or a broadcast module."},{"chapter":"Regulations & Operations","acs_code":"UA.I.A.K2","question_text":"Where must the FAA registration number appear on a Part 107 sUAS?","option_a":"Inside the battery compartment","option_b":"On the exterior, affixed by engraving, permanent label, or permanent marker","option_c":"In the flight controller's software settings","correct_option":"B","explanation":"Part 48 requires the registration number on the aircraft exterior, legible and durable."},{"chapter":"Regulations & Operations","acs_code":"UA.I.A.K3","question_text":"Which Part 107 provision may be waived with a Certificate of Waiver?","option_a":"The 16-year minimum age","option_b":"The 0.04% blood alcohol limit","option_c":"Visual line of sight (107.31)","correct_option":"C","explanation":"107.205 lists waivable sections including VLOS, night ops, and operations over people; age and alcohol limits cannot be waived."},{"chapter":"Regulations & Operations","acs_code":"UA.I.A.K4","question_text":"To fly in controlled airspace at or below the UAS Facility Map grid altitude, a remote pilot should use:","option_a":"LAANC","option_b":"A phone call to the control tower","option_c":"A mailed request to the FSDO","correct_option":"A","explanation":"LAANC provides near-real-time authorizations at or below published grid altitudes."},{"chapter":"Regulations & Operations","acs_code":"UA.I.A.K5","question_text":"Under current rules, night operations without a waiver require:","option_a":"A visual observer only","option_b":"Anti-collision lighting visible for 3 statute miles and completed night-operations training","option_c":"A filed NOTAM","correct_option":"B","explanation":"The 2021 final rule permits night ops under 107.29 with 3-sm lighting and updated training - no waiver needed."},{"chapter":"Regulations & Operations","acs_code":"UA.I.B.K1","question_text":"For Category 1 operations over people, the sUAS must:","option_a":"Weigh under 5 lb","option_b":"Carry a parachute","option_c":"Weigh 0.55 lb or less with no exposed rotating parts that could lacerate skin","correct_option":"C","explanation":"107.110 limits Category 1 to 0.55 lb or less with no exposed rotating parts capable of causing lacerations."},{"chapter":"Regulations & Operations","acs_code":"UA.I.B.K6b","question_text":"Sustained flight over an open-air assembly of people is:","option_a":"Prohibited unless authorized by waiver","option_b":"Allowed for Category 2 aircraft","option_c":"Allowed below 100 ft AGL","correct_option":"A","explanation":"107.39 prohibits operations over open-air assemblies; only an FAA waiver can authorize them."},{"chapter":"Regulations & Operations","acs_code":"UA.I.B.K9","question_text":"Under 107.145, an sUAS may transit over moving vehicles as long as it:","option_a":"Remains above 300 ft AGL","option_b":"Does not maintain sustained flight over them","option_c":"Carries a spotter in the vehicle","correct_option":"B","explanation":"107.145 allows transiting over moving vehicles but prohibits sustained flight over them."},{"chapter":"Regulations & Operations","acs_code":"UA.I.B.K14a","question_text":"Visual line of sight under 107.31 must be kept:","option_a":"Through the onboard camera feed","option_b":"By a crewmember watching a monitor","option_c":"By the Remote PIC or VO using unaided vision (corrective lenses excepted)","correct_option":"C","explanation":"107.31 requires VLOS with unaided vision; camera or goggle views alone do not satisfy it."},{"chapter":"Regulations & Operations","acs_code":"UA.I.B.K16","question_text":"When a manned aircraft approaches, the sUAS remote pilot must:","option_a":"Yield the right-of-way","option_b":"Hold position and hover","option_c":"Climb above the traffic","correct_option":"A","explanation":"107.37 gives manned aircraft the right-of-way; the sUAS must yield."},{"chapter":"Regulations & Operations","acs_code":"UA.I.B.K20","question_text":"Operating an sUAS carelessly or recklessly so as to endanger life or property violates:","option_a":"107.49","option_b":"107.23","option_c":"107.65","correct_option":"B","explanation":"107.23 prohibits careless or reckless operation."},{"chapter":"Regulations & Operations","acs_code":"UA.I.B.K21a","question_text":"Under 107.17, a person may not serve as Remote PIC while:","option_a":"Wearing corrective lenses","option_b":"Feeling nervous about the flight","option_c":"Having a medical condition that could interfere with safe operation","correct_option":"C","explanation":"107.17 bars crew participation when a medical or physical condition could compromise safety."},{"chapter":"Regulations & Operations","acs_code":"UA.I.A.K1","question_text":"Before each flight, 107.49 requires the remote pilot to assess:","option_a":"Weather, airspace restrictions, and the operating environment","option_b":"Only battery voltage","option_c":"Only the day's NOTAMs","correct_option":"A","explanation":"107.49 mandates preflight familiarization with weather, airspace, restrictions, and the operating area."},{"chapter":"Regulations & Operations","acs_code":"UA.I.A.K2","question_text":"A person without a Remote Pilot Certificate may manipulate the controls only:","option_a":"In Class G airspace","option_b":"Under the direct supervision of a Remote PIC able to immediately take over","option_c":"During daylight hours","correct_option":"B","explanation":"107.12 allows non-certificated operation only under direct Remote PIC supervision."},{"chapter":"Regulations & Operations","acs_code":"UA.I.A.K3","question_text":"Operating more than one sUAS at a time requires:","option_a":"A visual observer","option_b":"Two controllers","option_c":"A waiver to 107.35","correct_option":"C","explanation":"107.35 limits a Remote PIC to a single sUAS; multi-aircraft operations need a waiver."},{"chapter":"Regulations & Operations","acs_code":"UA.I.A.K4","question_text":"Operating an sUAS from a moving land vehicle is allowed only:","option_a":"Over sparsely populated areas","option_b":"On interstate highways","option_c":"With a chase car following","correct_option":"A","explanation":"107.25 permits it only over sparsely populated areas, and never from a moving aircraft."},{"chapter":"Regulations & Operations","acs_code":"UA.I.A.K5","question_text":"Routine Part 107 operations may be conducted during:","option_a":"Daylight only","option_b":"Daylight, civil twilight, and night (with required lighting and training)","option_c":"Night only with a waiver","correct_option":"B","explanation":"The 2021 rule expanded 107.29: night flight needs 3-sm anti-collision lighting and updated training, not a waiver."},{"chapter":"Regulations & Operations","acs_code":"UA.I.B.K1","question_text":"Before issuing a Remote Pilot Certificate, the TSA:","option_a":"Requires an FAA flight physical","option_b":"Interviews the applicant in person","option_c":"Screens the applicant for disqualifying security factors","correct_option":"C","explanation":"Part 107 applicants undergo TSA security vetting under 107.61."},{"chapter":"Regulations & Operations","acs_code":"UA.I.B.K6b","question_text":"A Part 107 Remote Pilot Certificate is earned by:","option_a":"Passing the FAA UAG knowledge test and TSA vetting","option_b":"Logging 40 hours of flight time","option_c":"Registering an sUAS with the FAA","correct_option":"A","explanation":"107.61/107.63: pass the initial knowledge test and clear TSA screening (Part 61 pilots may use the online course instead)."},{"chapter":"Regulations & Operations","acs_code":"UA.I.B.K9","question_text":"During Part 107 operations, the remote pilot must:","option_a":"Frame the certificate at home","option_b":"Make the Remote Pilot Certificate available for inspection","option_c":"Carry two forms of photo ID","correct_option":"B","explanation":"107.7 requires the certificate be available for FAA inspection during operations."},{"chapter":"Regulations & Operations","acs_code":"UA.I.B.K14a","question_text":"Operations that interfere with airport traffic patterns or airport operations are:","option_a":"Allowed with ATC approval","option_b":"Allowed below 200 ft AGL","option_c":"Prohibited under 107.43","correct_option":"C","explanation":"107.43 prohibits interfering with airport operations or traffic patterns."},{"chapter":"Regulations & Operations","acs_code":"UA.I.B.K16","question_text":"When a visual observer is used, 107.33 requires:","option_a":"Effective communication between the Remote PIC, control manipulator, and VO","option_b":"The VO to hold a remote pilot certificate","option_c":"The VO to operate the camera","correct_option":"A","explanation":"107.33 mandates effective communication and coordinated scanning among the crew."},{"chapter":"Regulations & Operations","acs_code":"UA.I.B.K20","question_text":"A waiver for beyond-visual-line-of-sight operations is requested through:","option_a":"A local FSDO visit","option_b":"FAA DroneZone","option_c":"LAANC","correct_option":"B","explanation":"Part 107 waivers under 107.205 are applied for via FAA DroneZone."},{"chapter":"Regulations & Operations","acs_code":"UA.I.B.K21a","question_text":"Flying an sUAS for compensation without a Remote Pilot Certificate is:","option_a":"Allowed if the drone is under 0.55 lb","option_b":"Covered by a TRUST certificate","option_c":"A violation - commercial operations require Part 107 certification","correct_option":"C","explanation":"Non-recreational operations require a Remote Pilot Certificate; TRUST applies only to recreational flyers under 44809."},{"chapter":"Airspace & Charts","acs_code":"UA.I.B.K1","question_text":"Class B airspace requires sUAS authorization because it:","option_a":"Surrounds the nation's busiest airports with dense airline traffic","option_b":"Is always prohibited to drones","option_c":"Is uncontrolled airspace","correct_option":"A","explanation":"Class B protects high-density traffic around major airports, so Part 107 requires explicit ATC authorization."},{"chapter":"Airspace & Charts","acs_code":"UA.I.B.K21b","question_text":"For manned aircraft entering Class C airspace, the requirement is:","option_a":"An explicit ATC clearance","option_b":"Established two-way radio communication with ATC","option_c":"A filed IFR flight plan","correct_option":"B","explanation":"Class C requires two-way radio contact before entry; Class B additionally requires a clearance."},{"chapter":"Airspace & Charts","acs_code":"UA.I.C.K4","question_text":"When the control tower at a Class D airport closes, the airspace typically:","option_a":"Becomes Class B","option_b":"Closes to all traffic","option_c":"Reverts to Class E or G","correct_option":"C","explanation":"Per the Chart Supplement, Class D reverts to Class E (surface) or G when the tower is closed."},{"chapter":"Airspace & Charts","acs_code":"UA.I.B.K1","question_text":"On a sectional chart, an airport printed in blue has:","option_a":"An operating control tower","option_b":"No services available","option_c":"A water runway","correct_option":"A","explanation":"Blue airport symbols denote towered airports; magenta denotes non-towered."},{"chapter":"Airspace & Charts","acs_code":"UA.I.B.K21b","question_text":"An alternating white-and-green airport beacon identifies:","option_a":"A military field","option_b":"A lighted land airport","option_c":"A heliport","correct_option":"B","explanation":"Per the AIM, white/green marks a lighted land airport; white/yellow marks a lighted water airport."},{"chapter":"Airspace & Charts","acs_code":"UA.I.C.K4","question_text":"The large blue numbers in each sectional quadrangle (maximum elevation figure) show:","option_a":"The airport elevation","option_b":"The minimum safe altitude","option_c":"The highest terrain or obstacle elevation plus a margin, rounded up","correct_option":"C","explanation":"The MEF is the highest known elevation plus at least 100 ft, rounded up to the next 100 ft."},{"chapter":"Airspace & Charts","acs_code":"UA.I.B.K1","question_text":"A small inverted-V symbol with dots on a sectional marks:","option_a":"A man-made obstacle","option_b":"A VFR checkpoint","option_c":"A windmill farm","correct_option":"A","explanation":"The inverted-V with dots is the chart symbol for a man-made obstacle."},{"chapter":"Airspace & Charts","acs_code":"UA.I.B.K21b","question_text":"A major sporting-event TFR generally covers:","option_a":"10 NM at all altitudes","option_b":"3 NM radius up to 3,000 ft AGL, from one hour before until one hour after the event","option_c":"Only the stadium structure itself","correct_option":"B","explanation":"FDC NOTAMs establish a 3 NM / 3,000-ft TFR around qualifying stadiums and speedways."},{"chapter":"Airspace & Charts","acs_code":"UA.I.C.K4","question_text":"A '0' value on the UAS Facility Map grid means:","option_a":"No altitude limit","option_b":"Surface operations only","option_c":"LAANC is unavailable there - request authorization through DroneZone","correct_option":"C","explanation":"Zero-grid areas need manual FAA authorization via DroneZone."},{"chapter":"Airspace & Charts","acs_code":"UA.I.B.K1","question_text":"Warning areas charted over the ocean (e.g., W-291) warn of:","option_a":"Hazardous military activity in international airspace","option_b":"Prohibited drone zones","option_c":"Hurricane evacuation routes","correct_option":"A","explanation":"Warning areas lie over international waters and alert pilots to hazardous activity."},{"chapter":"Airspace & Charts","acs_code":"UA.I.B.K21b","question_text":"An alert area (A-...) indicates:","option_a":"Prohibited airspace","option_b":"High-volume pilot training or unusual aerial activity","option_c":"An active TFR","correct_option":"B","explanation":"Alert areas inform of concentrated training; flight through them is permitted with vigilance."},{"chapter":"Airspace & Charts","acs_code":"UA.I.C.K4","question_text":"To find out whether a Military Operations Area is currently active, check:","option_a":"The airport directory only","option_b":"Social media","option_c":"NOTAMs and Flight Service or the controlling agency","correct_option":"C","explanation":"MOA activity status comes from NOTAMs, FSS, or the controlling agency."},{"chapter":"Airspace & Charts","acs_code":"UA.I.B.K1","question_text":"A magenta parachute symbol on a sectional indicates:","option_a":"A parachute jumping area","option_b":"A paragliding school","option_c":"An emergency landing field","correct_option":"A","explanation":"The symbol marks parachute jump areas where jump activity may occur."},{"chapter":"Airspace & Charts","acs_code":"UA.I.B.K21b","question_text":"Magenta glider or ultralight symbols on a sectional warn pilots of:","option_a":"Airport construction","option_b":"Soaring and ultralight activity","option_c":"Noise-sensitive areas","correct_option":"B","explanation":"These symbols mark areas of glider and ultralight activity."},{"chapter":"Airspace & Charts","acs_code":"UA.I.C.K4","question_text":"On a sectional chart, Victor airways appear as:","option_a":"Magenta dashed lines","option_b":"Green shaded bands","option_c":"Blue lines connecting navigation aids","correct_option":"C","explanation":"Victor airways are depicted as blue lines between VORs."},{"chapter":"Airspace & Charts","acs_code":"UA.I.B.K1","question_text":"Current airport weather and runway information near an operating area can be obtained from:","option_a":"ATIS or AWOS on the published frequency","option_b":"CTAF","option_c":"Frequency 121.5","correct_option":"A","explanation":"ATIS/AWOS broadcasts on charted frequencies give current conditions."},{"chapter":"Airspace & Charts","acs_code":"UA.I.B.K21b","question_text":"Gray lines labeled 'IR' or 'VR' on a sectional depict:","option_a":"Instrument approaches","option_b":"Military training routes with possible high-speed, low-altitude traffic","option_c":"Glider tow routes","correct_option":"B","explanation":"IR/VR routes are military training routes where fast low-level flights occur."},{"chapter":"Airspace & Charts","acs_code":"UA.I.C.K4","question_text":"Dashed magenta lines extending outward from a surface Class E area depict:","option_a":"TFR boundaries","option_b":"Class G corridors","option_c":"Class E extensions protecting instrument approaches","correct_option":"C","explanation":"These extensions provide controlled airspace for instrument approach procedures."},{"chapter":"Airspace & Charts","acs_code":"UA.I.B.K1","question_text":"Isogonic lines on a sectional connect points of:","option_a":"Equal magnetic variation","option_b":"Equal elevation","option_c":"Equal barometric pressure","correct_option":"A","explanation":"Isogonic lines join points of equal magnetic variation."},{"chapter":"Airspace & Charts","acs_code":"UA.I.B.K21b","question_text":"An airport marked 'PVT' on a sectional is:","option_a":"A public reliever airport","option_b":"Private-use - permission is required","option_c":"Permanently closed","correct_option":"B","explanation":"PVT denotes private-use airports requiring prior permission."},{"chapter":"Airspace & Charts","acs_code":"UA.I.C.K4","question_text":"A remote pilot checks for Temporary Flight Restrictions by reviewing:","option_a":"The airport's website","option_b":"Local news reports","option_c":"NOTAMs and the FAA TFR list before each flight","correct_option":"C","explanation":"TFRs are published via NOTAMs; checking them is part of preflight planning."},{"chapter":"Airspace & Charts","acs_code":"UA.I.B.K1","question_text":"Regarding transponders and ADS-B, Part 107 sUAS:","option_a":"Are not required to carry them","option_b":"Must squawk 1200 in Class E","option_c":"Need ADS-B Out above 400 ft","correct_option":"A","explanation":"Part 107 imposes no transponder or ADS-B equipage requirement on sUAS."},{"chapter":"Airspace & Charts","acs_code":"UA.I.B.K21b","question_text":"The scale of a sectional chart is:","option_a":"1:1,000,000","option_b":"1:500,000","option_c":"1:250,000","correct_option":"B","explanation":"Sectionals are 1:500,000; Terminal Area Charts are 1:250,000."},{"chapter":"Airspace & Charts","acs_code":"UA.I.C.K4","question_text":"Class C airspace charted as '125/55' extends from:","option_a":"1,250 to 5,500 ft AGL","option_b":"The surface to 12,500 ft","option_c":"5,500 ft MSL up to 12,500 ft MSL","correct_option":"C","explanation":"Charted Class C limits are in hundreds of feet MSL: ceiling 12,500, floor 5,500."},{"chapter":"Weather & METARs","acs_code":"UA.II.A.K1c","question_text":"In a METAR, 'BR' indicates:","option_a":"Mist","option_b":"Blowing dust","option_c":"Heavy rain","correct_option":"A","explanation":"BR denotes mist, with visibility between 5/8 and 6 statute miles."},{"chapter":"Weather & METARs","acs_code":"UA.II.B.K3","question_text":"'FG' in a METAR means:","option_a":"Freezing drizzle","option_b":"Fog","option_c":"Funnel cloud","correct_option":"B","explanation":"FG is the code for fog, with visibility below 5/8 statute mile."},{"chapter":"Weather & METARs","acs_code":"UA.II.B.K5","question_text":"'TSRA' in a METAR reports:","option_a":"Light snow","option_b":"Smoke","option_c":"Thunderstorm with rain","correct_option":"C","explanation":"TS = thunderstorm, RA = rain."},{"chapter":"Weather & METARs","acs_code":"UA.II.A.K1d","question_text":"In METAR precipitation codes, '-' and '+' signify:","option_a":"Light and heavy intensity","option_b":"Starting and ending","option_c":"Distant and overhead","correct_option":"A","explanation":"A minus is light, a plus is heavy; no sign means moderate intensity."},{"chapter":"Weather & METARs","acs_code":"UA.II.A.K1c","question_text":"'BKN' describes sky coverage of:","option_a":"1/8 to 2/8","option_b":"5/8 to 7/8","option_c":"8/8","correct_option":"B","explanation":"BKN = broken, covering 5/8 through 7/8 of the sky."},{"chapter":"Weather & METARs","acs_code":"UA.II.B.K3","question_text":"'SCT' means:","option_a":"Overcast","option_b":"Clear","option_c":"Scattered, 3/8 to 4/8 of the sky","correct_option":"C","explanation":"SCT = scattered, covering 3/8 to 4/8 of the sky."},{"chapter":"Weather & METARs","acs_code":"UA.II.B.K5","question_text":"In a METAR, 'A2992' reports:","option_a":"The altimeter setting, 29.92 inches of mercury","option_b":"The temperature aloft","option_c":"The wind at 9,992 ft","correct_option":"A","explanation":"The 'A' group gives the altimeter setting in inches of mercury."},{"chapter":"Weather & METARs","acs_code":"UA.II.A.K1d","question_text":"'M02' in a METAR temperature group means:","option_a":"Moderate icing at 2,000 ft","option_b":"Minus 2 degrees Celsius","option_c":"Missing temperature data","correct_option":"B","explanation":"'M' prefixes sub-zero temperatures in METAR reports."},{"chapter":"Weather & METARs","acs_code":"UA.II.A.K1c","question_text":"In '18012G22KT', the 'G22' indicates:","option_a":"Wind from 022 degrees","option_b":"Variable winds","option_c":"Gusts to 22 knots","correct_option":"C","explanation":"G announces gusts to the stated speed."},{"chapter":"Weather & METARs","acs_code":"UA.II.B.K3","question_text":"In a TAF, 'TEMPO' describes:","option_a":"Temporary fluctuations lasting less than half the indicated period","option_b":"A permanent change in conditions","option_c":"The issuance tempo","correct_option":"A","explanation":"TEMPO covers short-duration variations within the valid period."},{"chapter":"Weather & METARs","acs_code":"UA.II.B.K5","question_text":"'VCTS' in a METAR means:","option_a":"Heavy thunderstorms overhead","option_b":"Thunderstorms in the vicinity, 5 to 10 miles away","option_c":"Clearing skies","correct_option":"B","explanation":"VC = in the vicinity (5-10 SM); TS = thunderstorm."},{"chapter":"Weather & METARs","acs_code":"UA.II.A.K1d","question_text":"On a hot, humid day at high elevation, density altitude is:","option_a":"Lower than pressure altitude","option_b":"Equal to true altitude","option_c":"Higher than pressure altitude, reducing aircraft performance","correct_option":"C","explanation":"Heat, humidity, and elevation raise density altitude, cutting lift and power."},{"chapter":"Weather & METARs","acs_code":"UA.II.A.K1c","question_text":"Flying from high pressure to low pressure without resetting the altimeter, true altitude will be:","option_a":"Lower than indicated - 'high to low, look out below'","option_b":"Higher than indicated","option_c":"Exactly as indicated","correct_option":"A","explanation":"Falling pressure makes the altimeter read high; true altitude is lower."},{"chapter":"Weather & METARs","acs_code":"UA.II.B.K3","question_text":"Steady precipitation, poor visibility, and stratus clouds indicate:","option_a":"Unstable air","option_b":"Stable air","option_c":"A dry line","correct_option":"B","explanation":"Stable air resists vertical motion, producing stratus, drizzle, and poor visibility."},{"chapter":"Weather & METARs","acs_code":"UA.II.B.K5","question_text":"Cumuliform clouds, turbulence, and good visibility are signs of:","option_a":"A temperature inversion","option_b":"Stable air","option_c":"Unstable air","correct_option":"C","explanation":"Unstable air promotes vertical development: towering cumulus, turbulence, and clear visibility."},{"chapter":"Weather & METARs","acs_code":"UA.II.A.K1d","question_text":"The mature stage of a thunderstorm features:","option_a":"Both updrafts and downdrafts","option_b":"Updrafts only","option_c":"Only light rain","correct_option":"A","explanation":"The mature stage has simultaneous up- and downdrafts, producing the most severe hazards."},{"chapter":"Weather & METARs","acs_code":"UA.II.A.K1c","question_text":"A microburst is:","option_a":"A small tornado","option_b":"An intense localized downdraft with dangerous surface outflow","option_c":"A gust front","correct_option":"B","explanation":"Microbursts are violent downdrafts that spread outward on hitting the ground."},{"chapter":"Weather & METARs","acs_code":"UA.II.B.K3","question_text":"The FAA recommends avoiding thunderstorms by at least:","option_a":"5 miles","option_b":"10 miles","option_c":"20 miles","correct_option":"C","explanation":"The AIM advises staying 20 miles clear of thunderstorm activity."},{"chapter":"Weather & METARs","acs_code":"UA.II.B.K5","question_text":"A cold front typically brings:","option_a":"Steep, fast lifting with gusty winds and possible thunderstorms","option_b":"Days of steady drizzle","option_c":"Warm, calm air","correct_option":"A","explanation":"Cold fronts wedge under warm air abruptly, triggering violent weather."},{"chapter":"Weather & METARs","acs_code":"UA.II.A.K1d","question_text":"Upslope fog forms when:","option_a":"Cold air sits over warm water","option_b":"Moist air is forced up a slope and cools to saturation","option_c":"Skies clear on a calm night","correct_option":"B","explanation":"Orographic lifting cools moist air to its dew point, forming upslope fog."},{"chapter":"Weather & METARs","acs_code":"UA.II.A.K1c","question_text":"The standard atmospheric lapse rate is about:","option_a":"1C per 3,000 ft","option_b":"5C per 1,000 ft","option_c":"2C per 1,000 ft","correct_option":"C","explanation":"Temperature normally falls about 2C (3.5F) per 1,000 ft of altitude."},{"chapter":"Weather & METARs","acs_code":"UA.II.B.K3","question_text":"AIRMET Tango warns of:","option_a":"Moderate turbulence","option_b":"Icing","option_c":"Mountain obscuration","correct_option":"A","explanation":"Tango = turbulence; Sierra = IFR/mountain obscuration; Zulu = icing."},{"chapter":"Weather & METARs","acs_code":"UA.II.B.K5","question_text":"AIRMET Zulu warns of:","option_a":"Low-level wind shear","option_b":"Moderate icing","option_c":"Strong surface winds","correct_option":"B","explanation":"Zulu covers moderate icing and freezing levels."},{"chapter":"Weather & METARs","acs_code":"UA.II.A.K1d","question_text":"A routine TAF is valid for:","option_a":"6 hours","option_b":"12 hours","option_c":"24 or 30 hours","correct_option":"C","explanation":"TAFs are issued four times daily and are valid 24 or 30 hours."},{"chapter":"Operations & Safety","acs_code":"UA.V.C.K2","question_text":"The antidote for the hazardous attitude of invulnerability ('It won't happen to me') is:","option_a":"'It could happen to me'","option_b":"'Follow the rules'","option_c":"'Do it quickly'","correct_option":"A","explanation":"Recognizing personal vulnerability counters the invulnerability attitude."},{"chapter":"Operations & Safety","acs_code":"UA.V.E.K5","question_text":"In the IMSAFE personal checklist, 'I' stands for:","option_a":"Instrument","option_b":"Illness","option_c":"Inspection","correct_option":"B","explanation":"IMSAFE: Illness, Medication, Stress, Alcohol, Fatigue, Emotion."},{"chapter":"Operations & Safety","acs_code":"UA.V.F.K4","question_text":"In the PAVE checklist, 'E' stands for:","option_a":"Emergency","option_b":"Equipment","option_c":"Environment","correct_option":"C","explanation":"PAVE: Pilot, Aircraft, enVironment, External pressures."},{"chapter":"Operations & Safety","acs_code":"UA.V.E.K2","question_text":"In the DECIDE decision-making model, the first 'D' stands for:","option_a":"Detect","option_b":"Decide","option_c":"Do","correct_option":"A","explanation":"DECIDE: Detect, Estimate, Choose, Identify, Do, Evaluate."},{"chapter":"Operations & Safety","acs_code":"UA.V.D.K1","question_text":"At night, pilots look slightly off-center because:","option_a":"It reduces glare","option_b":"The fovea's cones are weak in dim light; peripheral rods detect faint objects better","option_c":"It speeds dark adaptation","correct_option":"B","explanation":"The night blind spot at the fovea makes off-center viewing essential."},{"chapter":"Operations & Safety","acs_code":"UA.V.C.K1","question_text":"Which retinal cells handle night vision?","option_a":"Cones","option_b":"Bipolar cells","option_c":"Rods","correct_option":"C","explanation":"Rods detect low light; cones handle color and sharp daytime vision."},{"chapter":"Operations & Safety","acs_code":"UA.V.B.K6a","question_text":"Acute stress typically causes a pilot to:","option_a":"Fixate narrowly and judge poorly","option_b":"React faster","option_c":"Multitask better","correct_option":"A","explanation":"Stress narrows attention and degrades judgment and decision-making."},{"chapter":"Operations & Safety","acs_code":"UA.V.E.K5","question_text":"'Get-there-itis' is an example of:","option_a":"A weather hazard","option_b":"External pressure degrading aeronautical decision-making","option_c":"A maintenance lapse","correct_option":"B","explanation":"Self- or passenger-imposed pressure is a classic ADM trap."},{"chapter":"Operations & Safety","acs_code":"UA.V.F.K4","question_text":"When workload exceeds capacity, the safest response is to:","option_a":"Work faster","option_b":"Skip the checklist","option_c":"Prioritize and shed or delegate tasks","correct_option":"C","explanation":"Managing task saturation means prioritizing essential tasks and deferring the rest."},{"chapter":"Operations & Safety","acs_code":"UA.V.E.K2","question_text":"A visual observer's primary job is to:","option_a":"Scan for aircraft and hazards and alert the crew","option_b":"Operate the camera","option_c":"Log the flight","correct_option":"A","explanation":"The VO maintains visual scanning and communicates traffic to the crew."},{"chapter":"Operations & Safety","acs_code":"UA.V.D.K1","question_text":"A remote pilot flying with FPV goggles must:","option_a":"Stay below 100 ft AGL","option_b":"Use a visual observer who maintains visual line of sight","option_c":"Fly only indoors","correct_option":"B","explanation":"107.31/107.33: goggles don't satisfy VLOS - a VO must keep the aircraft in sight."},{"chapter":"Operations & Safety","acs_code":"UA.V.C.K1","question_text":"Before flight, the lost-link failsafe should be set to:","option_a":"Continue the mission","option_b":"Land immediately","option_c":"Return home at an altitude above local obstacles","correct_option":"C","explanation":"A properly set RTH altitude keeps the aircraft clear of obstructions if the link fails."},{"chapter":"Operations & Safety","acs_code":"UA.V.B.K6a","question_text":"If a flyaway cannot be corrected, the pilot should note time, position, and direction, and:","option_a":"Notify ATC if the aircraft may enter controlled airspace","option_b":"File a NASA report only","option_c":"Power down the controller","correct_option":"A","explanation":"AC 107-2 advises alerting ATC when an errant aircraft threatens controlled airspace."},{"chapter":"Operations & Safety","acs_code":"UA.V.E.K5","question_text":"Launching near steel structures or power lines risks:","option_a":"Battery swelling","option_b":"Compass errors causing erratic flight","option_c":"Stronger GPS reception","correct_option":"B","explanation":"Magnetic interference corrupts the compass, leading to toilet-bowling or flyaways."},{"chapter":"Operations & Safety","acs_code":"UA.V.F.K4","question_text":"If GPS is lost and the sUAS drops to ATTI mode:","option_a":"It lands automatically","option_b":"Motors idle","option_c":"Position hold is lost and it drifts with the wind","correct_option":"C","explanation":"ATTI mode holds attitude only; the pilot must manually counter drift."},{"chapter":"Operations & Safety","acs_code":"UA.V.E.K2","question_text":"The return-to-home altitude should be:","option_a":"Above the tallest obstacle in the area","option_b":"Always 400 ft AGL","option_c":"As low as possible","correct_option":"A","explanation":"RTH must clear terrain, trees, and structures along the return path."},{"chapter":"Operations & Safety","acs_code":"UA.V.D.K1","question_text":"Preflight propeller checks should look for:","option_a":"Brand markings","option_b":"Nicks, cracks, and secure attachment","option_c":"Color fading","correct_option":"B","explanation":"Damaged or loose props cause vibration and can fail in flight."},{"chapter":"Operations & Safety","acs_code":"UA.V.C.K2","question_text":"Outdated firmware should be:","option_a":"Ignored until the off-season","option_b":"Updated only by the manufacturer","option_c":"Updated and test-flown before operational flights","correct_option":"C","explanation":"Updates can change flight behavior; verify them before real missions."},{"chapter":"Operations & Safety","acs_code":"UA.V.B.K6a","question_text":"When wildfire-fighting aircraft are operating nearby, a remote pilot must:","option_a":"Stay clear and check NOTAMs for TFRs - 'if you fly, they can't'","option_b":"Coordinate with the incident commander","option_c":"Fly under 200 ft AGL","correct_option":"A","explanation":"91.137 TFRs protect firefighting operations; drones must stay out."},{"chapter":"Operations & Safety","acs_code":"UA.V.E.K5","question_text":"For storage beyond a few days, LiPo batteries should be kept at:","option_a":"Full charge","option_b":"About 40-60% charge (storage voltage)","option_c":"Fully depleted","correct_option":"B","explanation":"Storage charge (about 3.8 V/cell) minimizes capacity loss and swelling risk."},{"chapter":"Operations & Safety","acs_code":"UA.V.F.K4","question_text":"LiPo batteries should be charged:","option_a":"Inside the aircraft","option_b":"Overnight unattended","option_c":"On a non-flammable surface, never unattended","correct_option":"C","explanation":"Unattended or improper charging is a leading cause of LiPo fires."},{"chapter":"Operations & Safety","acs_code":"UA.V.E.K2","question_text":"A crew briefing before flight should cover:","option_a":"Roles, communication, emergency procedures, and the flight plan","option_b":"Only the weather","option_c":"Aircraft maintenance history","correct_option":"A","explanation":"Briefings align the crew on duties, signals, and contingencies (CRM)."},{"chapter":"Operations & Safety","acs_code":"UA.V.D.K1","question_text":"During critical phases of flight, crews should:","option_a":"Chat to stay alert","option_b":"Minimize non-essential talk and distractions","option_c":"Turn off the radios","correct_option":"B","explanation":"The sterile-cockpit concept keeps attention on flying during critical phases."},{"chapter":"Operations & Safety","acs_code":"UA.V.C.K1","question_text":"Evaluating a new operating site should include:","option_a":"Only wind direction","option_b":"Only battery access","option_c":"Obstacles, people, airspace, weather, and emergency landing spots","correct_option":"C","explanation":"Site assessment covers hazards, airspace, people, and outs."},{"chapter":"Loading & Performance","acs_code":"UA.II.B.K4b","question_text":"In a level 45-degree banked turn, load factor is about:","option_a":"1.4 G","option_b":"2.0 G","option_c":"1.0 G","correct_option":"A","explanation":"Load factor = 1/cos(bank angle); at 45 degrees it is about 1.41 G."},{"chapter":"Loading & Performance","acs_code":"UA.III.B.K1j","question_text":"In a level turn, load factor increases as:","option_a":"Airspeed decreases","option_b":"Bank angle increases","option_c":"Altitude increases","correct_option":"B","explanation":"Steeper banks demand more lift, raising the load factor."},{"chapter":"Loading & Performance","acs_code":"UA.II.B.K4b","question_text":"As load factor rises, stall speed:","option_a":"Falls","option_b":"Stays constant","option_c":"Rises","correct_option":"C","explanation":"Higher load factor raises stall speed, proportional to the square root of load factor."},{"chapter":"Loading & Performance","acs_code":"UA.III.B.K1j","question_text":"A forward center of gravity typically produces:","option_a":"Greater stability with higher stall speed and heavier control forces","option_b":"Neutral stability","option_c":"Aft-CG handling","correct_option":"A","explanation":"Forward CG increases longitudinal stability but raises stall speed."},{"chapter":"Loading & Performance","acs_code":"UA.II.B.K4b","question_text":"Weight shifted to one side (lateral imbalance) causes:","option_a":"Faster cruise","option_b":"Roll toward the heavy side, forcing motors to work harder","option_c":"Better efficiency","correct_option":"B","explanation":"Lateral CG offset demands constant correction and wastes power."},{"chapter":"Loading & Performance","acs_code":"UA.III.B.K1j","question_text":"Adding payload weight to an sUAS:","option_a":"Improves stability","option_b":"Extends endurance","option_c":"Increases power required and shortens flight time","correct_option":"C","explanation":"More weight demands more thrust, draining the battery faster."},{"chapter":"Loading & Performance","acs_code":"UA.II.B.K4b","question_text":"If a payload moves the CG outside the allowable envelope, the pilot must:","option_a":"Reposition or remove the payload before flying","option_b":"Fly more slowly","option_c":"Add ballast at random","correct_option":"A","explanation":"Flight outside CG limits risks loss of control."},{"chapter":"Loading & Performance","acs_code":"UA.III.B.K1j","question_text":"At high density altitude, an sUAS suffers:","option_a":"Greater lift","option_b":"Reduced propeller and rotor efficiency, requiring more power","option_c":"Cooler motors","correct_option":"B","explanation":"Thin air gives propellers less bite, cutting lift and thrust."},{"chapter":"Loading & Performance","acs_code":"UA.II.B.K4b","question_text":"Extreme heat harms LiPo batteries by:","option_a":"Increasing capacity","option_b":"Lowering voltage sag","option_c":"Raising internal resistance and risk of permanent damage or fire","correct_option":"C","explanation":"Heat accelerates cell degradation and thermal runaway risk."},{"chapter":"Loading & Performance","acs_code":"UA.III.B.K1j","question_text":"A rapid vertical descent into the aircraft's own downwash can trigger:","option_a":"Vortex ring state - a sudden loss of lift","option_b":"Ground effect","option_c":"Translational lift","correct_option":"A","explanation":"Vortex ring state ('settling with power') demands lateral movement to escape."},{"chapter":"Loading & Performance","acs_code":"UA.II.B.K4b","question_text":"Hovering close to the ground in ground effect:","option_a":"Reduces lift","option_b":"Increases efficiency by reducing induced drag","option_c":"Causes compass errors","correct_option":"B","explanation":"The ground interferes with downwash, improving hover efficiency."},{"chapter":"Loading & Performance","acs_code":"UA.III.B.K1j","question_text":"Pushing a multirotor into a strong headwind:","option_a":"Extends range","option_b":"Recharges the battery","option_c":"Burns more power and shortens range","correct_option":"C","explanation":"Fighting wind demands extra thrust, draining the pack faster."},{"chapter":"Loading & Performance","acs_code":"UA.II.B.K4b","question_text":"A chipped or unbalanced propeller:","option_a":"Causes vibration, wastes power, and stresses motors","option_b":"Improves cooling","option_c":"Is safe if the chip is small","correct_option":"A","explanation":"Prop damage should ground the aircraft until replaced."},{"chapter":"Loading & Performance","acs_code":"UA.III.B.K1j","question_text":"Overloading can overheat motors and ESCs, risking:","option_a":"Longer flights","option_b":"In-flight motor or ESC failure","option_c":"Better efficiency","correct_option":"B","explanation":"Excess current overheats components beyond their ratings."},{"chapter":"Loading & Performance","acs_code":"UA.II.B.K4b","question_text":"As LiPo packs age through many cycles, they:","option_a":"Gain capacity","option_b":"Get lighter","option_c":"Lose capacity and deliver shorter flights","correct_option":"C","explanation":"Cycle aging increases internal resistance and reduces usable capacity."},{"chapter":"Loading & Performance","acs_code":"UA.III.B.K1j","question_text":"Compared with hovering, steady forward flight in a multirotor is generally:","option_a":"More efficient, thanks to translational lift","option_b":"Less efficient","option_c":"Equally efficient","correct_option":"A","explanation":"Moving into clean air improves rotor efficiency versus hovering."},{"chapter":"Loading & Performance","acs_code":"UA.II.B.K4b","question_text":"A payload that shifts in flight can:","option_a":"Improve balance","option_b":"Jolt the CG and cause loss of control","option_c":"Extend endurance","correct_option":"B","explanation":"Secure all payloads; a shifting CG can overwhelm the flight controller."},{"chapter":"Loading & Performance","acs_code":"UA.III.B.K1j","question_text":"Before a long mission, the pilot should ensure:","option_a":"Maximum speed outbound","option_b":"Minimum altitude","option_c":"Enough battery reserve for the return plus contingencies","correct_option":"C","explanation":"Plan the return leg and a reserve - wind can change mid-flight."},{"chapter":"Loading & Performance","acs_code":"UA.II.B.K4b","question_text":"An overloaded sUAS handles:","option_a":"Sluggishly, with reduced control margins","option_b":"More crisply","option_c":"The same as normal","correct_option":"A","explanation":"Excess weight dulls response and shrinks maneuvering margins."},{"chapter":"Loading & Performance","acs_code":"UA.III.B.K1j","question_text":"The key weight-and-balance check after modifying an sUAS is:","option_a":"Paint weight","option_b":"Total weight within limits and CG within the envelope","option_c":"Propeller weight","correct_option":"B","explanation":"Confirm gross weight and CG before every modified configuration."},{"chapter":"Loading & Performance","acs_code":"UA.II.B.K4b","question_text":"A LiPo's C-rating indicates:","option_a":"Capacity in milliamp-hours","option_b":"Cell count","option_c":"Maximum safe continuous discharge rate","correct_option":"C","explanation":"The C-rating times capacity gives the maximum current draw."},{"chapter":"Loading & Performance","acs_code":"UA.III.B.K1j","question_text":"A '4S' LiPo pack has:","option_a":"Four cells in series","option_b":"Four cells in parallel","option_c":"Four spare cells","correct_option":"A","explanation":"Series count sets nominal voltage (4S is about 14.8 V)."},{"chapter":"Loading & Performance","acs_code":"UA.II.B.K4b","question_text":"Heavy throttle causes voltage sag, which can:","option_a":"Recharge the pack","option_b":"Trigger early low-voltage warnings and cut performance","option_c":"Cool the motors","correct_option":"B","explanation":"Sag under load may trip voltage cutoffs before the pack is truly empty."},{"chapter":"Loading & Performance","acs_code":"UA.III.B.K1j","question_text":"In thinner air at altitude, electric motors:","option_a":"Spin slower","option_b":"Use less current","option_c":"Draw more current to make the same lift","correct_option":"C","explanation":"Reduced air density forces higher RPM and current for equal thrust."}];
const LS_KEY = "part107_attempts_v1";

const $ = id => document.getElementById(id);
const setupScreen=$("setup-screen"), quizScreen=$("quiz-screen"), doneScreen=$("done-screen");

function loadAttempts(){ try{ return JSON.parse(localStorage.getItem(LS_KEY))||[]; }catch(e){ return []; } }
